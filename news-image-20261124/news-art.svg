<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">World Desk — 24 November 2026</title>
  <desc id="desc">Four reported developments from Canberra, New Zealand, South Korea and Cape Town.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H24M23.5 0V24" fill="none" stroke="#f4d8b0" stroke-opacity=".14"/></pattern>
    <pattern id="ticks" width="18" height="12" patternUnits="userSpaceOnUse"><path d="M0 0V12" stroke="#938c7a" stroke-width="1"/></pattern>
    <style>
      text{font-family:Arial,sans-serif;fill:#142c2c} .mono{font-family:Consolas,monospace;font-weight:700;letter-spacing:1.6px} .paper{fill:#f4e9d1} .cream{fill:#f8ebcb} .mint{fill:#bfd0b7} .small{font-size:22px} .label{font-size:20px} .headline{font-weight:800;letter-spacing:-1.1px} .foot{font-size:19px} .lav{fill:#dfd8ed} .line{stroke:#142c2c;stroke-width:2}
    </style>
  </defs>
