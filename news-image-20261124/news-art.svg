    <text x="17" y="157" font-size="39" class="headline"><tspan x="17">Cape Town to</tspan><tspan x="17" dy="41">unveil Statue</tspan><tspan x="17" dy="41">of Peace</tspan></text>
    <text x="18" y="281" class="small"><tspan x="18">Memorial to victims of</tspan><tspan x="18" dy="26">wartime sexual slavery</tspan></text>
    <path d="M18 317h270" class="line"/>
