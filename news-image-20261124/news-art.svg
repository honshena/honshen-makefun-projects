    <text x="17" y="157" font-size="39" class="headline"><tspan x="17">South Korea</tspan><tspan x="17" dy="41">issues brief</tspan><tspan x="17" dy="41">island alert</tspan></text>
    <text x="18" y="281" class="small"><tspan x="18">Russian aircraft entered</tspan><tspan x="18" dy="26">defence zone, not airspace</tspan></text>
