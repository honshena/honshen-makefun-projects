    <text x="34" y="47" class="mono label">01 / DIPLOMACY</text>
    <text x="24" y="126" font-size="64" class="headline cream"><tspan x="24">Singapore &amp;</tspan><tspan x="24" dy="66">Australia sign</tspan><tspan x="24" dy="66">two pacts</tspan></text>
    <path d="M24 309h492" stroke="#8ea697"/>
    <text x="24" y="352" class="cream" font-size="27"><tspan x="24">The deals protect essential supplies</tspan><tspan x="24" dy="35">and enable cross-border CO₂ storage.</tspan></text>
    <text x="24" y="423" class="mono label mint">CNA / LEADERS’ MEETING</text>
  </g>
  <g transform="translate(34 627)">
